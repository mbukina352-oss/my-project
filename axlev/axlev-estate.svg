<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;display=swap');</style>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#1b4634"/>
      <stop offset="0.55" stop-color="#0e2c20"/>
      <stop offset="1" stop-color="#061710"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e1a4"/>
      <stop offset="0.5" stop-color="#d6b166"/>
      <stop offset="1" stop-color="#a47e38"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="55%" r="45%">
      <stop offset="0" stop-color="#06170f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06170f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- полупрозрачный лев с axlev.ru (слой делает lion.py) -->
  <image href="lion-layer.png" x="110" y="40" width="1700" height="1002" opacity="0.34"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- надпись -->
  <g font-family="'Cormorant Garamond', 'Times New Roman', serif" text-anchor="middle" fill="url(#gold)" filter="url(#shadow)">
    <text x="978" y="590" font-size="250" font-weight="600" letter-spacing="36">AXLEV</text>
    <rect x="700" y="648" width="520" height="2" fill="#d6b166"/>
    <text x="983" y="738" font-size="66" font-weight="500" letter-spacing="46">ESTATE</text>
  </g>
</svg>
